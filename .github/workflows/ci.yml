name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # Bun strips types rather than checking them, so tsc stays on as the
    # typechecker even though it no longer builds anything.
    - name: Typecheck
      run: bun run typecheck

    - name: Lint
      run: bun run lint

    - name: Test
      run: bun test
