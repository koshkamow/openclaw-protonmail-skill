name: CI

on:
  push:
    branches: [ main, develop ]
  # No branch filter: work ships as a stack, so most PRs target the layer
  # below rather than main. Filtering to main/develop meant CI ran on the
  # bottom PR of a chain and on none of the others.
  pull_request:

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # Bun strips types rather than checking them, so tsc stays on as the
    # typechecker even though it no longer builds anything.
    - name: Typecheck
      run: bun run typecheck

    # `biome check` is the linter, the formatter check and import sorting in one
    # pass, so unformatted code fails here rather than drifting until someone
    # notices. --error-on-warnings is in the script: a warning let the `any`s
    # through under the previous linter.
    - name: Lint and format (biome)
      run: bun run lint

    - name: Test
      run: bun test
